<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle with Brand Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Dark Surface -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="13" fill="url(#innerGrad)" />

  <!-- Terminal Prompt Chevron '>' in Cyan -->
  <path d="M19 21 L31 32 L19 43" fill="none" stroke="#22d3ee" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal Cursor '_' in Indigo/Purple -->
  <line x1="36" y1="43" x2="48" y2="43" stroke="#818cf8" stroke-width="5.5" stroke-linecap="round" />
</svg>
